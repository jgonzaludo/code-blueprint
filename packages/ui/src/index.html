<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%231b6fc4'/%3E%3Cpath d='M4 5h5M4 8h8M4 11h4' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bp-app">
  <header class="bp-top">
    <h1>Blueprint</h1>
    <span class="bp-live" id="bp-live" role="status">connecting</span>
    <span class="bp-seg" id="bp-modes" role="group" aria-label="View" hidden>
      <button data-m="current">Current code</button><button data-m="plan">Claude's plan</button><button data-m="applied">After applying</button>
    </span>
    <span class="bp-planname" id="bp-planname" hidden></span>
    <span class="bp-seg" id="bp-scope" role="group" aria-label="Scope" hidden>
      <button data-s="focus" title="Changed files and what they touch">Changes + 1 hop</button><button data-s="all">Whole project</button>
    </span>
    <span class="bp-planname" id="bp-scopenote"></span>
    <span class="bp-meta" id="bp-meta"></span>
    <span class="bp-spacer"></span>
    <button class="bp-btn" id="bp-relayout" title="Throw away the cached file positions and lay out again">Re-layout</button>
    <button class="bp-btn" id="bp-theme" aria-label="Switch theme">Theme</button>
  </header>
  <main class="bp-work">
    <section class="bp-panel bp-vpwrap" aria-label="Code map">
      <div class="bp-vp" id="bp-vp" tabindex="0">
        <div class="bp-world bp-map" id="bp-world"></div>
        <div class="bp-tools">
          <span class="bp-lvl" id="bp-lvl">Project map</span>
          <button class="bp-btn" id="bp-zo" aria-label="Zoom out">-</button>
          <button class="bp-btn" id="bp-zi" aria-label="Zoom in">+</button>
          <button class="bp-btn" id="bp-fit">Fit</button>
        </div>
        <div class="bp-card" id="bp-card" hidden></div>
        <div class="bp-insp" id="bp-insp" hidden></div>
        <div class="bp-legend" id="bp-legend" hidden></div>
        <div class="bp-hint" id="bp-hint">Drag to pan. Ctrl or Cmd with the wheel to zoom. Double-click a file to zoom to it.</div>
        <div class="bp-empty" id="bp-empty" hidden>No TypeScript or JavaScript files found here.</div>
      </div>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
